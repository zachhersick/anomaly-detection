[project]
name = 'anomaly-detection'
version = '0.1.0'
requires-python = '>=3.11,<3.14'
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/anomaly_detection']

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn",
    "pydantic",
]
dashboard = [
    "streamlit",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",
    "httpx2",
]

[tool.ruff.lint.per-file-ignores]
"src/anomaly_detection/api.py" = ["B008", "BLE001"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python_versions }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python_versions: ["3.11", "3.12", "3.13"]

    env:
      UV_PYTHON: ${{ matrix.python_versions }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_versions }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --python ${{ matrix.python_versions }}

      - name: Run Ruff
        run: uv run --no-sync ruff check

      - name: Run tests
        run: uv run --no-sync python -m pytest -q
